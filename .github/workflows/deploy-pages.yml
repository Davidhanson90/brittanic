name: Deploy UI To Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI for GitHub Pages
        run: npm run build

      - name: Verify built entrypoints
        run: |
          if grep -q "src/main.ts" dist/index.html; then
            echo "dist/index.html still references src/main.ts; aborting deploy"
            exit 1
          fi
          if ! grep -Eq '<script[^>]+type="module"[^>]+src="\.?/assets/.+\.js"' dist/index.html; then
            echo "dist/index.html does not reference a built assets JS bundle; aborting deploy"
            exit 1
          fi

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload UI artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
